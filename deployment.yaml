apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactapp-ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reactapp-ui
  template:
    metadata:
      labels:
        app: reactapp-ui
    spec:
      containers:
      - name: reactapp-ui
        image: kokismoki/reactapp-ui:63205ff66c483d9f0296d5ca369374d5912d8f72
        ports:
        - containerPort: 80
