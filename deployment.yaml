apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactapp-ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reactapp-ui
  template:
    metadata:
      labels:
        app: reactapp-ui
    spec:
      containers:
      - name: reactapp-ui
        image: kokismoki/reactapp-ui:fa7dbe6723e226cfbc6f76a4b162f52f99c045a2
        ports:
        - containerPort: 80
